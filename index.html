<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="description" content="Inês Marques, biomedical engineer in Lisbon: research, health data and applied AI."><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Inês Marques Home</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a full-bleed board of flat-colour tetromino pieces that drop in on load; hovering turns a piece into a photo (max 3 open); labelled pieces open a section panel */
  :root {
    color-scheme: dark;
    --bg: #0d1210;
    --ink: #eae7dd;
    --ink-dim: #9aa39a;
    --dark: #14110d;
    --yellow: #f0e130;
    --pink: #ee9a9a;
    --sand: #dbd6b8;
    --blue: #3f8bd0;
    --violet: #b52cf0;
    --orange: #ff7d12;
    --brown: #5e3410;
    --red: #e2261f;
    --green: #4fe3a0;
    --signal: #4fe3a0; --heat: #ff8a4a; --line: #263029;
    --display: 'Bricolage Grotesque', 'IBM Plex Sans', system-ui, sans-serif;
    --body: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--ink); }
  body { font-family: var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  header.top {
    display: grid; grid-template-columns: 1fr auto; gap: 8px 24px; align-items: baseline;
    padding: 18px 16px 22px; font: 13px/1.4 var(--mono);
  }
  header.top .who { color: var(--ink); grid-column: 1 / -1; }
  @media (min-width: 760px) { header.top .who { grid-column: auto; } }
  header.top .what { color: var(--ink-dim); }
  header.top button { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  @media (min-width: 760px) {
    header.top { grid-template-columns: 1fr 1fr auto; padding-inline: 12px; }
  }

  /* board */
  .board { position: relative; overflow: hidden; display: grid; grid-template-columns: repeat(var(--cols), 1fr); }
  .cell {
    position: relative; aspect-ratio: 1; background: var(--c); overflow: hidden; cursor: pointer;
    /* hairline overlap so pieces read as solid shapes without seams */
    margin: 0 -0.5px -0.5px 0;
  }
  .cell.fall { animation: drop var(--dur, .7s) cubic-bezier(.55,0,.35,1.12) var(--delay, 0s) both; }
  @keyframes drop { from { transform: translateY(var(--from)); } to { transform: none; } }
  .cell .ph { position: absolute; clip-path: inset(0 0 100% 0); transition: clip-path .55s cubic-bezier(.7,0,.2,1) var(--rd, 0s); }
  .cell .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell.open .ph { clip-path: inset(0 0 0 0); }
  .cell.shut .ph { clip-path: inset(100% 0 0 0); }
  .lbl {
    position: absolute; z-index: 2; font: 500 clamp(10px, 1vw, 13px) var(--mono); letter-spacing: .06em; text-transform: uppercase;
    color: var(--dark); padding: 3px 6px; border: 0; background: transparent; cursor: pointer;
    transition: background .3s, color .3s;
  }
  .lbl.tl { top: 10%; left: 8%; } .lbl.tr { top: 10%; right: 8%; } .lbl.bl { bottom: 10%; left: 8%; } .lbl.br { bottom: 10%; right: 8%; }
  .cell.open .lbl { background: var(--c); }
  .cell[data-dark] .lbl { color: var(--ink); }
  .cell.labelled:hover .lbl, .lbl:focus-visible { text-decoration: underline; text-underline-offset: 3px; }

  .hint { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 24px; padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); font: 12px var(--mono); color: var(--ink-dim); }
  .hint a { color: var(--ink-dim); }

  /* section panel */
  .panel {
    position: fixed; inset: 0; z-index: 40; background: var(--pc, var(--sand)); color: var(--dark);
    overflow-y: auto; overscroll-behavior: contain;
    clip-path: inset(0 0 100% 0); visibility: hidden;
    transition: clip-path .6s cubic-bezier(.7,0,.2,1), visibility 0s linear .6s;
  }
  .panel.on { clip-path: inset(0 0 0 0); visibility: visible; transition: clip-path .6s cubic-bezier(.7,0,.2,1), visibility 0s; }
  .panel[data-dark] { color: var(--ink); }
  .panel .inner { max-width: 1100px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(60px + env(safe-area-inset-bottom, 0px)); }
  .panel .bar { display: flex; justify-content: space-between; align-items: center; font: 13px var(--mono); margin-bottom: 8vh; }
  .panel .close { font: 13px var(--mono); color: inherit; background: none; border: 1.5px solid currentColor; padding: 8px 14px; cursor: pointer; }
  .panel h2 { font: 800 clamp(3rem, 12vw, 9rem)/.85 var(--display); letter-spacing: -.045em; margin: 0 0 6vh; text-transform: uppercase; text-wrap: balance; }
  .panel .lead { font: 500 clamp(1.15rem, 2.4vw, 1.6rem)/1.35 var(--body); max-width: 40ch; margin: 0 0 6vh; }
  .panel .rows { display: grid; gap: 0; border-top: 1.5px solid currentColor; }
  .panel .row { display: grid; grid-template-columns: 10rem 1fr; gap: 8px 28px; padding: 20px 0; border-bottom: 1.5px solid currentColor; }
  .panel .row > * { min-width: 0; }
  .panel .row .when { font: 12px/1.5 var(--mono); padding-top: 4px; font-variant-numeric: tabular-nums; }
  .panel .row h3 { font: 700 clamp(1.1rem, 2vw, 1.4rem)/1.2 var(--display); margin: 0 0 6px; }
  .panel .row .org { font: 12px var(--mono); margin: 0 0 8px; text-transform: uppercase; letter-spacing: .05em; }
  .panel .row p { margin: 0; font-size: 15px; line-height: 1.55; max-width: 68ch; }
  @media (max-width: 640px) { .panel .row { grid-template-columns: 1fr; } }
  .panel .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .panel .chip { font: 13px var(--mono); border: 1.5px solid currentColor; padding: 6px 10px; }
  .panel .strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0; margin: 6vh 0 0; }
  .panel .strip img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .panel .big { font: 700 clamp(1.4rem, 4vw, 2.6rem) var(--display); word-break: break-all; user-select: all; margin: 0 0 14px; }
  .panel .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
  .panel .btn { font: 14px var(--mono); color: inherit; background: none; border: 1.5px solid currentColor; padding: 10px 16px; cursor: pointer; text-decoration: none; }
  .panel .note { font: 12px var(--mono); margin-top: 6vh; }
  .panel .note a { color: inherit; }


  /* ---------- dark panels (Experience, Thesis, Contact) ---------- */
  .panel.tint h2 { color: var(--ac); }
  .panel .kicker { font: 13px/1.4 var(--mono); color: var(--signal); margin: 0 0 14px; }
  .panel .kicker a, .panel .cap a, .panel .prose a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .panel .headline { font: 700 clamp(1.8rem, 5.2vw, 2.8rem)/1.12 var(--display); margin: 0 0 20px; max-width: 18ch; text-wrap: balance; }
  .panel .sub { font-size: 16px; line-height: 1.55; max-width: 46ch; margin: 0; color: var(--ink-dim); }
  .panel .cap { font: 12.5px/1.5 var(--mono); color: var(--ink-dim); margin: 10px 0 0; }

  /* experience */
  .xp { display: grid; border-top: 1.5px solid currentColor; }
  .xp-row { display: grid; grid-template-columns: 10rem minmax(0, 1fr); gap: 10px 28px; padding: 26px 0 32px; border-bottom: 1.5px solid currentColor; }
  .xp-row .when { font: 12px/1.5 var(--mono); padding-top: 4px; font-variant-numeric: tabular-nums; }
  .xp-row .when i { display: block; width: 28px; height: 6px; background: var(--a); margin-bottom: 12px; }
  .xp-row h3 { font: 700 clamp(1.15rem, 2.2vw, 1.5rem)/1.2 var(--display); margin: 0 0 6px; }
  .xp-row .org { font: 12px/1.4 var(--mono); color: var(--a); margin: 0 0 10px; text-transform: uppercase; letter-spacing: .05em; }
  .xp-row .org a { color: inherit; }
  .xp-row p { margin: 0; font-size: 15px; line-height: 1.6; max-width: 66ch; }
  .xp-row p.org { max-width: none; }
  .xp-row p strong { font-weight: 600; }
  .shots { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; align-items: flex-start; }
  .shots img { display: block; height: auto; width: 100%; border-radius: 6px; }
  .shots.one { max-width: 640px; }
  @media (max-width: 640px) { .xp-row { grid-template-columns: 1fr; } }

  /* thesis */
  .thesis-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(200px, 280px); gap: 40px; align-items: start; }
  .vid { margin: 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #000; }
  .vid video { width: 100%; height: auto; aspect-ratio: 9 / 16; object-fit: contain; display: block; }
  .vid .cap { padding: 10px 14px 14px; margin: 0; }
  @media (max-width: 760px) { .thesis-row { grid-template-columns: 1fr; } .vid { max-width: 300px; } }
  .stats { display: flex; gap: 22px 28px; flex-wrap: wrap; margin: 28px 0 0; }
  .stat { min-width: 120px; }
  .stat .num { font: 700 1.9rem var(--display); color: var(--signal); }
  .stat .slbl { font-size: 13px; color: var(--ink-dim); margin-top: 2px; max-width: 18ch; }
  .repo { display: inline-flex; flex-direction: column; gap: 4px; margin-top: 26px; padding: 14px 18px; border: 1px solid var(--signal); border-radius: 8px; color: var(--ink); text-decoration: none; max-width: 100%; }
  .repo:hover { background: rgba(79, 227, 160, .08); }
  .repo .path { font: 12.5px var(--mono); color: var(--ink-dim); word-break: break-all; }
  .repo .go { font: 600 16px var(--display); color: var(--signal); }
  .panel .prose { font-size: 15.5px; line-height: 1.65; color: var(--ink-dim); max-width: 64ch; margin: 0 0 14px; }
  .panel .prose a { color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 0; }
  .tag { font: 12px var(--mono); color: var(--ink-dim); border: 1px solid var(--line); border-radius: 4px; padding: 4px 9px; }
  .fig { margin: 40px 0 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .fig img { width: 100%; height: auto; display: block; }
  .fig .cap { padding: 10px 14px 14px; margin: 0; }

  /* contact */
  .elements { display: flex; gap: 10px; flex-wrap: wrap; margin: 30px 0 18px; padding-top: 22px; }
  .el { position: relative; width: 108px; aspect-ratio: 1; max-width: 30%; border: 1.5px solid var(--c, var(--signal)); border-radius: 6px; padding: 9px 10px; display: flex; flex-direction: column; justify-content: space-between; color: var(--ink); background: color-mix(in srgb, var(--c, var(--signal)) 8%, transparent); animation: tilein .45s ease-out both; }
  .el .z { font: 12px var(--mono); color: var(--ink-dim); display: flex; justify-content: space-between; gap: 4px; }
  .el .sym { font: 700 clamp(2rem, 7vw, 2.7rem)/1 var(--display); color: var(--c, var(--signal)); }
  .el .nm { font-size: 11.5px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .el.glow .sym { text-shadow: 0 0 6px var(--c), 0 0 18px var(--c); animation: flicker 4s infinite; }
  @keyframes tilein { from { opacity: .2; transform: translateY(8px) rotate(-3deg); } to { opacity: 1; transform: none; } }
  @keyframes flicker { 0%, 92%, 100% { opacity: 1; } 94% { opacity: .55; } 96% { opacity: 1; } 97% { opacity: .7; } }
  .el-picker { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .el-picker span { font: 12px var(--mono); color: var(--ink-dim); margin-right: 4px; }
  .el-picker button { font: 13px var(--mono); color: var(--ink-dim); background: none; border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
  .el-picker button[aria-pressed="true"] { color: var(--bg); background: var(--signal); border-color: var(--signal); }
  .el-note { font-size: 14px; color: var(--ink-dim); margin: 0 0 8px; max-width: 60ch; line-height: 1.55; min-height: 3.1em; }
  .contact-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 40px; align-items: start; margin-top: 44px; }
  @media (max-width: 700px) { .contact-grid { grid-template-columns: 1fr; gap: 32px; } }
  .cform { display: flex; flex-direction: column; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field label { font: 12px var(--mono); color: var(--ink-dim); letter-spacing: .04em; text-transform: uppercase; }
  .field input, .field textarea { font: 15px var(--body); color: var(--ink); background: rgba(255, 255, 255, .04); border: 1px solid var(--line); border-radius: 6px; padding: 11px 12px; width: 100%; }
  .field textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--signal); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .send { align-self: flex-start; font: 600 15px var(--display); color: var(--bg); background: var(--signal); border: none; border-radius: 6px; padding: 12px 22px; cursor: pointer; }
  .send:disabled { opacity: .6; cursor: wait; }
  .form-status { font-size: 14.5px; line-height: 1.55; border-left: 2px solid var(--line); padding: 4px 0 4px 12px; margin: 0; }
  .form-status.ok { border-color: var(--signal); }
  .form-status.err { border-color: var(--heat); }
  .copy, .form-status button { font: 13px var(--mono); background: none; color: var(--signal); border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; cursor: pointer; margin-left: 6px; }
  .direct { display: flex; flex-direction: column; gap: 22px; }
  .direct h3 { font: 600 1rem var(--body); margin: 0 0 6px; }
  .direct p { margin: 0; font-size: 14.5px; color: var(--ink-dim); line-height: 1.55; }
  .direct a { color: var(--signal); }
  .addr { font: 14px var(--mono); color: var(--ink); word-break: break-all; user-select: all; }
  .panel button:focus-visible, .panel a:focus-visible, .panel input:focus-visible, .panel textarea:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  .twrap { --signal: color-mix(in srgb, var(--blue) 82%, white); }
  .twrap .repo:hover { background: rgba(63, 139, 208, .1); }
  .cwrap { --signal: color-mix(in srgb, var(--violet) 70%, white); --heat: var(--pink); }
  .cwrap .send { color: #1a0a22; }

  /* hobbies */
  .hob-sec { border-top: 1.5px solid currentColor; padding: 34px 0 46px; display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 22px 40px; }
  .hob-sec h3 { font: 800 clamp(1.9rem, 4vw, 3rem)/1 var(--display); letter-spacing: -.03em; text-transform: uppercase; margin: 0 0 12px; }
  .hob-sec .meta { font: 12px/1.4 var(--mono); margin: 0 0 12px; }
  .hob-sec p { font-size: 15px; line-height: 1.6; max-width: 42ch; margin: 0; }
  .hob-sec .mosaic { min-width: 0; }
  .mosaic { columns: 3 170px; column-gap: 8px; }
  .mosaic img { width: 100%; height: auto; display: block; margin: 0 0 8px; break-inside: avoid; }
  .mosaic.one { columns: 1; max-width: 640px; }
  .mosaic.two { columns: 2; max-width: 760px; }
  @media (max-width: 760px) { .hob-sec { grid-template-columns: 1fr; } .mosaic { columns: 2 130px; } .mosaic.two { columns: 2; } }

  @media (prefers-reduced-motion: reduce) { .el, .el.glow .sym { animation: none; } }

  @media (prefers-reduced-motion: reduce) {
    .cell.fall { animation: none; }
    .cell .ph, .panel, .panel.on { transition: none; }
  }
</style>

<header class="top">
  <span class="who">inês marques, biomedical engineer</span>
  <span class="what" id="tagline">who counted 100,000 neurons in a fish brain smaller than a pinhead</span>
  <button type="button" data-open="about">about</button>
</header>

<main>
  <div class="board" id="board" aria-label="Portfolio board: hover a piece to reveal a photo, choose a label to open a section"></div>
  <div class="hint"><span>Hover the pieces to uncover photos. Click a label to open it.</span><span>Lisbon, Portugal</span></div>
</main>

<section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" tabindex="-1">
  <div class="inner">
    <div class="bar"><span>inês marques</span><button type="button" class="close" id="close">Close</button></div>
    <div id="panel-body"></div>
  </div>
</section>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // a different tagline on every visit, never the same one twice in a row
  const TAGLINES = [
    'who counted 100,000 neurons in a fish brain smaller than a pinhead',
    'who went from ballet stages to zebrafish brains to national health data',
    'who rowed to a national title and now trains neural networks',
    'who danced at the Royal Albert Hall and now writes Apex',
    'who taught a computer to tell neurons apart',
    'who helped redesign Portugal\'s national HIV surveillance system',
    'who won a hackathon at Nova SBE and studied in three countries',
  ];
  (() => {
    let last = -1;
    try { last = +(localStorage.getItem('tagline') ?? -1); } catch (e) {}
    // step through the list in order; a random start for first-time visitors
    const i = last >= 0 ? (last + 1) % TAGLINES.length : Math.floor(Math.random() * TAGLINES.length);
    document.getElementById('tagline').textContent = TAGLINES[i];
    try { localStorage.setItem('tagline', i); } catch (e) {}
  })();
  const PHOTOS = ['stage-kick','istanbul','desert','studio','stage-red','salt-flat','festival','portrait'];
  const src = k => 'img/' + k + '.jpg';
  

  /* 4 x 8 board; each letter is one piece (T, S, Z, L-trominoes, dominoes, singles) */
  const MAP = [
    'aaabccdd',
    'eafbbcdg',
    'eefhhiig',
    'jekkhhil',
  ];
  const PIECES = {
    a: { photo: 'studio', c: 'yellow', label: 'Experience', sec: 'experience', corner: 'tl' },
    b: { photo: 'barre', c: 'pink' },
    c: { photo: 'istanbul', c: 'sand', label: 'Education', sec: 'education', corner: 'tr' },
    d: { photo: 'tulips', c: 'blue', label: 'Thesis', sec: 'thesis', corner: 'br', dark: 1 },
    e: { photo: 'portrait', c: 'green', label: 'Hobbies', sec: 'hobbies', corner: 'bl' },
    f: { photo: 'desert', c: 'orange' },
    g: { photo: 'wheat', c: 'violet', label: 'Contact', sec: 'contact', corner: 'br', dark: 1 },
    h: { photo: 'stage-kick', c: 'red', label: 'Skills', sec: 'skills', corner: 'tl', dark: 1 },
    i: { photo: 'salt-flat', c: 'yellow', label: 'Awards', sec: 'awards', corner: 'br' },
    j: { photo: 'ski', c: 'pink' },
    k: { photo: 'festival', c: 'blue', label: 'About', sec: 'about', corner: 'bl', dark: 1 },
    l: { photo: 'friends', c: 'brown' },
  };
  // labelled pieces only show photos that match their section; unlabelled pieces share PHOTOS
  const POOLS = {
    a: ['accenture-1', 'accenture-3', 'accenture-4'],
    c: ['thesis-tecnico', 'thesis-symposium'],
    d: ['thesis-larva', 'thesis-tracking'],
    e: ['stage-arch', 'rowing-double', 'cappadocia', 'barre', 'rowing-pier', 'ski'],
    // every photo belongs to exactly one set, so two pieces never show the same image
    g: ['wheat'],
    h: ['accenture-2'],
    i: ['trophies', 'medals-table', 'rowing-podium-2', 'rowing-event'],
    k: ['friends', 'tulips'],
  };
  Object.entries(POOLS).forEach(([id, pool]) => { PIECES[id].pool = pool; });
  [...new Set(PHOTOS.concat(...Object.values(POOLS)))].forEach(k => { const i = new Image(); i.src = src(k); });
  const OPEN_AT_START = ['e', 'h', 'd'];
  const MAX_OPEN = 3;

  const board = document.getElementById('board');
  let open = [];            // piece ids, oldest first
  let shown = {};           // piece id -> photo key
  let photoIdx = 0;
  let layout = null;

  // next photo in a piece's own set, skipping any photo another piece is showing
  const nextFrom = (p) => {
    const inUse = new Set(Object.values(shown));
    for (let n = 0; n < p.pool.length; n++) {
      p.n = ((p.n ?? -1) + 1) % p.pool.length;
      if (!inUse.has(p.pool[p.n])) return p.pool[p.n];
    }
    return p.pool[p.n];
  };
  const nextPhoto = () => {
    const inUse = new Set(Object.values(shown));
    for (let n = 0; n < PHOTOS.length; n++) {
      const k = PHOTOS[photoIdx++ % PHOTOS.length];
      if (!inUse.has(k)) return k;
    }
    return PHOTOS[0];
  };

  const build = (animate) => {
    const narrow = innerWidth < 700;
    if (layout === narrow && !animate) return;
    layout = narrow;
    board.innerHTML = '';
    const rows = narrow ? 8 : 4, cols = narrow ? 4 : 8;
    board.style.setProperty('--cols', cols);
    // collect cells per piece (transpose on phones so the board runs down the screen)
    const cells = {};
    MAP.forEach((line, r) => [...line].forEach((id, c) => {
      const [rr, cc] = narrow ? [c, r] : [r, c];
      (cells[id] = cells[id] || []).push([rr, cc]);
    }));
    // drop order: pieces whose lowest cell is lowest land first

          sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
          const payload = { name, email, message: msg, _subject: 'Portfolio: ' + (subject || 'message from ' + name), _replyto: email, _template: 'table', _captcha: 'false' };
          fetch('https://formsubmit.co/ajax/' + TO, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(payload) })
            .then(r => r.json())
            .then(res => {
              if (res && (res.success === true || res.success === 'true')) {
                form.reset();
                show('ok', 'Sent. Thank you, ' + name.split(' ')[0].replace(/[<>&]/g, '') + '. I will reply to ' + email.replace(/[<>&]/g, '') + '.');
              } else throw new Error('not sent');
            })
            .catch(() => {
              // AJAX can fail (pending FormSubmit activation, blocked request); fall back to a normal form post
              const f = document.createElement('form');
              f.method = 'POST'; f.action = 'https://formsubmit.co/' + TO; f.style.display = 'none';
              Object.entries({ ...payload, _next: location.origin + location.pathname + '?sent=1' }).forEach(([k, v]) => {
                const i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = v; f.appendChild(i);
              });
              document.body.appendChild(f);
              show('ok', 'Sending…');
              f.submit();
            })
            .then(() => { sendBtn.disabled = false; sendBtn.textContent = 'Send message'; });
        });
      } },
  };

  const panel = document.getElementById('panel'), body = document.getElementById('panel-body');
  let returnFocus = null;
  function openPanel(sec, p) {
    const s = S[sec]; if (!s) return;
    returnFocus = document.activeElement;
    panel.style.setProperty('--pc', s.bg || `var(--${p ? p.c : 'sand'})`);
    panel.style.setProperty('--ac', `var(--${p ? p.c : 'sand'})`);
    panel.classList.toggle('tint', !!s.bg);
    if (s.dark || (p && p.dark)) panel.dataset.dark = ''; else delete panel.dataset.dark;
    body.innerHTML = `<h2 id="panel-title">${s.t}</h2>${typeof s.html === 'function' ? s.html() : s.html}`;
    panel.scrollTop = 0;
    panel.classList.add('on');
    panel.focus({ preventScroll: true });
    if (s.init) s.init();
  }
  const closePanel = () => {
    panel.classList.remove('on');
    if (returnFocus) returnFocus.focus({ preventScroll: true });
    // empty the panel once it has slid away so its video stops playing
    setTimeout(() => { if (!panel.classList.contains('on')) body.innerHTML = ''; }, 800);
  };
  document.getElementById('close').addEventListener('click', closePanel);
  addEventListener('keydown', e => { if (e.key === 'Escape' && panel.classList.contains('on')) closePanel(); });
  document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => openPanel(b.dataset.open, PIECES.k)));
  // back from FormSubmit's normal post: confirm on the Contact panel
  if (new URLSearchParams(location.search).has('sent')) {
    history.replaceState(null, '', location.pathname);
    openPanel('contact', PIECES.g);
    const st = document.getElementById('c-status');
    st.className = 'form-status ok'; st.textContent = 'Sent. Thank you, I will reply soon.'; st.hidden = false;
  }
})();
</script>
